<main class="screen" id="screen">
  <div class="ambient"></div>
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>

  <header class="topbar">
    <button class="clock" id="clockBtn" type="button" aria-label="打开万年历">
      <time id="clock">--:--</time>
      <span class="dateline"><i id="date"></i><i id="lunar" class="lunar"></i><i id="seasonTag" class="stag"></i></span>
    </button>

    <!-- v218：情景组 + 家人 chip 包同一层 flex（原来 scenes 独占 1fr 列居中）。
         左移 + chip 紧跟 pill 右侧都靠这一层实现；grid 列数保持 3 列不变 -->
    <div class="top-mid">
      <div class="scenes" id="scenes" role="group" aria-label="情景模式"></div>
      <div class="people-bar" id="peopleBar" role="group" aria-label="家人在线状态"></div>
    </div>

    <div class="weather" id="weatherBtn" role="button" tabindex="0" aria-label="查看天气">
      <div class="w-line"><svg class="w-icon"><use href="#i-drop"/></svg><b id="wTemp">—</b><span class="w-desc" id="wDesc">待接入</span></div>
      <div class="w-range" id="wRange">天气实体未配置</div>
    </div>
  </header>

  <!-- 今日用电：从天气块里挪出来，落在右上角两排按钮的正下方，右边界跟按钮组对齐 -->
  <div class="w-kwh" id="wKwh" role="button" tabindex="0" aria-label="查看用电详情" hidden></div>

  <div class="layout-toggles" role="group" aria-label="布局显示">
    <!-- 外观设置已移到左下角 LoveHome 那一条（#fnSet）：那一排按钮只剩 5 个 -->
    <button class="lt-btn" id="ltFull" type="button" title="进入全屏（F11）" aria-label="全屏" aria-pressed="false">
      <svg><use href="#i-full"/></svg>
    </button>
    <button class="lt-btn" id="ltSide" type="button" title="隐藏左栏" aria-label="隐藏左栏" aria-pressed="true">
      <svg><use href="#i-side-left"/></svg>
    </button>
    <button class="lt-btn" id="ltTop" type="button" title="隐藏顶栏" aria-label="隐藏顶栏" aria-pressed="true">
      <svg><use href="#i-top-bar"/></svg>
    </button>
    <button class="lt-btn" id="ltHaSide" type="button" title="隐藏 HA 侧边栏" aria-label="隐藏 HA 侧边栏" aria-pressed="true">
      <svg><use href="#i-ha-side"/></svg>
    </button>
    <button class="lt-btn" id="ltHaTop" type="button" title="隐藏 HA 顶栏" aria-label="隐藏 HA 顶栏" aria-pressed="true">
      <svg><use href="#i-ha-top"/></svg>
    </button>
    <!-- 窄屏（<1150）底部那条放不下时，外观设置回这个位置；宽屏隐藏 -->
    <button class="lt-btn only-narrow" id="ltSetN" type="button" title="外观设置（字体大小 · 面板透明度 · 主题 · 配色 · 右侧留白）" aria-label="外观设置">
      <svg><use href="#i-cog"/></svg>
    </button>
  </div>

  <!-- 主题色（四季）快捷切换：与上面 4 个布局按钮同一套外观，选中项高亮 -->
  <div class="season-toggles" id="seasonToggles" role="group" aria-label="四季配色">
    <button class="st-btn" data-season="auto" type="button" title="跟随节气" aria-label="四季配色跟随节气" aria-pressed="true"><i></i></button>
    <button class="st-btn" data-season="spring" type="button" title="春 · 嫩绿" aria-label="春季配色" aria-pressed="false"><i></i></button>
    <button class="st-btn" data-season="summer" type="button" title="夏 · 湖青" aria-label="夏季配色" aria-pressed="false"><i></i></button>
    <button class="st-btn" data-season="autumn" type="button" title="秋 · 柿橙" aria-label="秋季配色" aria-pressed="false"><i></i></button>
    <button class="st-btn" data-season="winter" type="button" title="冬 · 霜蓝" aria-label="冬季配色" aria-pressed="false"><i></i></button>
    <!-- 昼夜主题：一个按钮三态轮换 日出(浅色) → 日落(深色) → 自动 -->
    <button class="sun-btn" id="sunBtn" data-mode="auto" type="button" title="主题 · 跟随日出日落" aria-label="主题跟随日出日落" aria-pressed="false">
      <svg><use href="#i-sunmoon"/></svg>
    </button>
    <!-- v235 现实风格底板：一键把户型色块换成手绘风照片（assets/plan-real.jpg），
         与昼夜主题、四季配色正交，状态由 applySkin 回写 -->
    <button class="skin-btn" id="skinBtn" type="button" title="现实风格底板" aria-label="现实风格底板" aria-pressed="false">
      <img class="skin-ico" src="./QLovehome.png" alt="">
    </button>
  </div>

  <div class="metrics" id="metrics" aria-hidden="true">
    <span class="m"><svg><use href="#i-home"/></svg>室内 <b id="inTemp">23.8</b>°</span>
    <span class="m"><svg><use href="#i-drop"/></svg>湿度 <b id="inHum">52</b>%</span>
    <span class="m"><svg><use href="#i-bolt"/></svg>今日 <b id="todayKwh">3.42</b> kWh</span>
    <button class="room-info" id="roomInfoBtn" type="button"><svg><use href="#i-chev"/></svg>房间信息</button>
    <span class="tag-demo" id="demoTag">示例数据</span>
  </div>

  <section class="stage" id="stage">
    <aside class="side" id="side"></aside>
    <div class="plan-wrap" id="planWrap"></div>
    <aside class="room-panel" id="roomPanel" hidden aria-label="房间信息">
      <div class="rp-head"><div><b id="rpName">客厅</b><span id="rpMeta">—</span></div><button class="close" id="rpClose" type="button">×</button></div>
      <div class="rp-body" id="rpBody"></div>
    </aside>
    <!-- 没开房间面板时，第三列这块 400px 就是常驻栏：常用设备 + 安防网关 -->
    <aside class="alt-panel" id="altPanel" hidden aria-label="常用设备与安防网关">
      <div class="alt-head"><b>常用设备 · 安防</b><button class="close" id="altClose" type="button" title="收起（点底部「首页」或设置里可再打开）">×</button></div>
      <div class="alt-body" id="altBody"></div>
    </aside>
  </section>

  <!-- 底部一条：左边只剩「首页」一个页面，概览 / 家电都改成弹窗（不盖住户型图），右边是图层筛选 -->
  <div class="filters" id="filters" role="group" aria-label="页面与图层筛选">
    <div class="fgroup" id="pageTabs" role="group" aria-label="页面切换">
      <button class="filter ptab active" data-page="home" type="button"><svg><use href="#i-home"/></svg><span>首页</span></button>
      <button class="filter ptab" data-pop="overview" type="button"><svg><use href="#i-bolt"/></svg><span>概览</span></button>
      <button class="filter ptab" data-pop="appliance" type="button"><svg><use href="#i-washer"/></svg><span>家电</span></button>
    </div>
    <span class="fsep" aria-hidden="true"></span>
    <div class="fgroup" id="filterChips" role="group" aria-label="图层筛选"></div>
  </div>

  <div class="layer" id="layer" hidden>
    <div class="layer-head"><div><b id="layerTitle">万年历</b><span id="layerSub"></span></div><button class="close" id="layerClose" type="button">×</button></div>
    <div class="layer-body" id="layerBody"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="standby" id="standby" hidden>
    <time id="sbClock">--:--</time>
    <div class="sb-date" id="sbDate"></div>
    <div class="sb-lunar" id="sbLunar"></div>
    <span class="sb-hint">轻触屏幕，回到家</span>
  </div>

  <!-- 左下角一条：品牌 + 数据状态 + 两个入口（待机屏保 / 外观设置）。窄屏整条让位，
       外观设置由右上角那个 .only-narrow 的齿轮接回去，保证任何宽度都能开设置 -->
  <div class="footer-note">
    <span class="fn-brand">QLovehome</span><i class="fn-dot">·</i><span class="fn-src" id="srcNote">示意版</span>
    <span class="fn-sep" aria-hidden="true"></span>
    <!-- 两个入口：左「外观设置（齿轮）」右「锁定屏幕（锁）」 -->
    <button class="fn-btn" id="fnSet" type="button" title="外观设置（面板透明度 · 主题 · 配色 · 右侧留白）" aria-label="外观设置">
      <svg><use href="#i-cog"/></svg>
    </button>
    <button class="fn-btn" id="fnIdle" type="button" title="锁定屏幕 · 待机屏保（闲置 5 分钟也会自动出现）" aria-label="锁定屏幕">
      <svg><use href="#i-lock"/></svg>
    </button>
  </div>
</main>

<script src="./qlovehome-data.js?v=242"></script>
<script src="./qlovehome.js?v=300"></script>
<script src="./qlovehome-editor.js?v=25"></script>
</body>
</html>
